function render(){answered=false;$('count').textContent=`Soalan ${index+1} daripada ${data.length}`;$('score').textContent=`Markah: ${score}`;$('bar').style.width=(index/data.length*100)+'%';$('question').textContent=data[index][0];$('options').innerHTML='';data[index][1].forEach((v,i)=>{let b=document.createElement('button');b.className='opt';b.textContent='ABCD'[i]+'. '+v;b.onclick=()=>choose(i);$('options').appendChild(b)});$('feedback').className='feedback';$('feedback').style.display='none';$('feedback').textContent='';$('next').disabled=true;$('next').textContent=index===data.length-1?'Lihat keputusan':'Soalan seterusnya →'}
